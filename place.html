<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"  href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>
<body>
   <header>
    <h1>Nigeria</h1>
   </header>
   <main>
    <div class="bgimg">
        <source media="(min-width: 1024px)" srcset="images/Abuja-Gate-large.webp">
        <source media="(min-width: 600px)" srcset="images/Abuja-Gate-medium.webp">
        <img src="images/Abuja-Gate-small.webp" alt="Abuja city gate monument" loading="lazy" width="500" height="285">
    </div>
    <section class="data">
        <h2>Data</h2>
        <ul>
            <li>Area</li>
            <li>Population</li>
            <li>Capital</li>
            <li>Languages</li>
            <li>currency</li>
            <li>Time Zone</li>
            <li>Call code</li>
            <li>Internet TD</li>
        </ul>
    </section>

     <section class="weather">
        <h2>Weather</h2>
        <div class="weather-icon">
            <img src="images/weather-icon.svg" alt="weather icon" width="50" height="50">
        </div>
        <ul>
            <li>Temperature</li>
            <li>Condition</li>
            <li>Wind</li>
            <li>Wind Chill</li>
        </ul>
            
    </section>
   </main>

   <footer>
        <p>
            © <span id="currentyear"> </span> ✨ Charles Edache Isama✨ Nigeria 
        </p>
        <p id="lastModified"></p>
    </footer>
    
</body>
</html>
