<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Dynamic Web Fundamentals:Nigeria Page - Charles Isama</title>
    <meta name="description" content="WDD 131 - Dynamic Web Fundamental- Nigeria Country Page">
    <meta name="author" content="Charles Isama">
    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>
<body>
    
   <header>
    <h1>Nigeria</h1>
   </header>

   <main>
        <picture class="bgimg">
            <source media="(min-width: 800px)" srcset="images/hero-large.webp">
            <source media="(min-width: 500px)" srcset="images/hero-medium.webp">
            <img src="images/hero-small.webp" alt="Abuja city gate monument" width="500" height="333" loading="lazy">
        </picture>


    <section class="data">
        <h2>Data</h2>
        <ul id="data-list">
            <li>Area:</li>
            <li>Population:</li>
            <li>Capital:</li>
            <li>Languages:</li>
            <li>Currency:</li>
            <li>Time Zone:</li>
            <li>Call code:</li>
            <li>Internet TLD:</li>
        </ul>
    </section>

     <section class="weather">
        <h2>Weather</h2>
        <div class="weather-icon">
            <img src="images/weather-icon.svg" alt="weather icon" width="50" height="50">
        </div>
        <ul id="weather-list">
            <li>Temperature:</li>
            <li>Condition:</li>
            <li>Wind:</li>
            <li>Wind Chill:</li>
        </ul>
    </section>
   </main>

   <footer>
        <p>
            © <span id="currentyear"></span> ✨ Charles Edache Isama✨ Nigeria
        </p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
